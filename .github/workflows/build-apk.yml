name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config cmake \
            build-essential libffi-dev libssl-dev zlib1g-dev libltdl-dev \
            ccache

      - name: Install buildozer & Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Cython==0.29.33" buildozer

      - name: Cache Android SDK/NDK (buildozer global dir)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache buildozer project build dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 30
          # Source downloads (e.g. GNU Savannah for freetype) occasionally
          # 504 / time out from CI IP ranges. .buildozer/ persists between
          # attempts within the same job, so a retry resumes instead of
          # rebuilding everything from scratch.
          command: yes | buildozer android debug
        env:
          # Android's Bionic libc has no setgrent()/getgrent()/endgrent()
          # (only getgrgid()/getgrnam()). CPython's ./configure otherwise
          # detects them as present, so Modules/grpmodule.c tries to call
          # them and the NDK's clang errors out on the implicit
          # declaration instead of warning. These autoconf cache
          # variables tell configure the three functions are
          # unavailable, so grpmodule.c stops wrapping them - the rest
          # of the grp module (getgrgid/getgrnam) is unaffected. Set at
          # the job-environment level (rather than a recipe override) so
          # python-for-android's own patches still apply from their real
          # upstream location.
          ac_cv_func_setgrent: "no"
          ac_cv_func_getgrent: "no"
          ac_cv_func_endgrent: "no"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-repository-apk
          path: bin/*.apk
          if-no-files-found: error
