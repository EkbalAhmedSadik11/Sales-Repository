name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config cmake \
            build-essential libffi-dev libssl-dev zlib1g-dev libltdl-dev \
            ccache

      - name: Install buildozer & Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Cython==0.29.33" buildozer

      - name: Cache Android SDK/NDK (buildozer global dir)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache buildozer project build dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          # Includes the workflow file itself (not just buildozer.spec):
          # this cache holds partially-built recipe directories (already
          # `./configure`'d, Makefile generated). A change to *how* we
          # build doesn't necessarily touch buildozer.spec, so without
          # this a stale, already-configured build dir from before the
          # change would keep getting restored and `make` would silently
          # reuse it instead of re-running configure.
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('buildozer.spec', '.github/workflows/build-apk.yml') }}

      - name: Pre-clone python-for-android and fix its pip self-upgrade step
        run: |
          P4A_DIR=".buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          if [ ! -d "$P4A_DIR" ]; then
            git clone -b master --single-branch https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi
          # python-for-android's run_pymodules_install() upgrades pip inside
          # a fresh venv by running the venv's `pip` console-script entry
          # point ("pip install -U pip"). Self-upgrading pip that way - via
          # its own currently-running entry-point script rather than
          # `python -m pip` - reproducibly corrupts the install mid-way
          # (the running process's own files get overwritten under it),
          # breaking every retry identically with:
          #   ImportError: cannot import name 'open_rich_spinner' from
          #   'pip._internal.cli.spinners'
          # `python -m pip` re-resolves the pip module fresh on each
          # invocation instead of going through that stale script wrapper,
          # which avoids the failure mode entirely.
          sed -i 's/pip install -U pip/python -m pip install -U pip/' \
            "$P4A_DIR/pythonforandroid/build.py"
          grep -n "python -m pip install -U pip" "$P4A_DIR/pythonforandroid/build.py" \
            || echo "::warning::pip self-upgrade patch pattern not found - build.py may have changed upstream"

      - name: Build APK
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 30
          # Source downloads (e.g. GNU Savannah for freetype) occasionally
          # 504 / time out from CI IP ranges. .buildozer/ persists between
          # attempts within the same job, so a retry resumes instead of
          # rebuilding everything from scratch.
          command: yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-repository-apk
          path: bin/*.apk
          if-no-files-found: error
